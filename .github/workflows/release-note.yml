name: Save PR Diff to Snowflake

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  save-diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install snowflake-connector-python

      - name: Get PR diff
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Obtendo diff do Pull Request..."
            curl -s -H "Accept: application/vnd.github.v3.diff" \
              "${{ github.event.pull_request.diff_url }}" > diff.txt
            echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          else
            echo "Obtendo diff entre main e HEAD..."
            git fetch origin main
            git diff origin/main...HEAD > diff.txt
            echo "PR_NUMBER=0" >> $GITHUB_ENV
          fi

      - name: Save diff to Snowflake
        env:
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
        run: |
          python <<'EOF'
          import os, base64, snowflake.connector

          pr_number = int(os.getenv("PR_NUMBER", "0"))

          # Lê o diff
          with open("diff.txt", "r") as f:
              diff_content = f.read()
          
          print(f"📄 Tamanho do diff: {len(diff_content)} caracteres")

          # Trunca se for muito grande (por segurança)
          diff_content = diff_content[:20000]

          # Codifica em base64 (para evitar erro de parsing)
          diff_encoded = base64.b64encode(diff_content.encode("utf-8")).decode("utf-8")

          # Conecta ao Snowflake
          conn = snowflake.connector.connect(
              user=os.getenv("SNOWFLAKE_USER"),
              password=os.getenv("SNOWFLAKE_PASSWORD"),
              account=os.getenv("SNOWFLAKE_ACCOUNT"),
              warehouse=os.getenv("SNOWFLAKE_WAREHOUSE"),
              database=os.getenv("SNOWFLAKE_DATABASE"),
              schema=os.getenv("SNOWFLAKE_SCHEMA"),
              role=os.getenv("SNOWFLAKE_ROLE")
          )

          cur = conn.cursor()
          try:
             
              # Insere o diff
              cur.execute(
                  "INSERT INTO code_diffs (pr_number, diff_text) VALUES (%s, %s)",
                  (pr_number, diff_encoded)
              )

              print(f"✅ Diff salvo com sucesso no Snowflake para PR #{pr_number}")

          finally:
              cur.close()
              conn.close()
          EOF