name: Generate Release Note

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-note:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release note
        id: notes
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          fromTag: ${{ github.event.pull_request.base.sha }}
          toTag: ${{ github.event.pull_request.head.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed files
        id: files
        run: |
          echo "FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | paste -sd ',' -)" >> $GITHUB_ENV

      - name: Post release note as PR comment
        if: success()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            📝 **Release Notes Preview**
            ---
            ${{ steps.notes.outputs.changelog }}

            📂 **Arquivos alterados:**
            ${{ env.FILES }}