name: 🧠 Snowflake Release Flow

on:
  pull_request:
    branches: [staging, main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  analyze-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependências Python
        run: pip install snowflake-connector-python requests

      - name: Obter diff do PR
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          echo "DIFF<<EOF" >> $GITHUB_ENV
          git diff origin/${{ github.base_ref }}...HEAD >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Gerar documentação com Snowflake (modo staging ou main)
        id: snowflake
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          python <<'EOF'
          import os, snowflake.connector, json

          conn = snowflake.connector.connect(
              user=os.getenv("SNOWFLAKE_USER"),
              password=os.getenv("SNOWFLAKE_PASSWORD"),
              account=os.getenv("SNOWFLAKE_ACCOUNT"),
              warehouse=os.getenv("SNOWFLAKE_WAREHOUSE"),
              database=os.getenv("SNOWFLAKE_DATABASE"),
              schema=os.getenv("SNOWFLAKE_SCHEMA"),
              role=os.getenv("SNOWFLAKE_ROLE")
          )
          cur = conn.cursor()

          diff_text = os.getenv("DIFF", "")[:10000]  # limita para evitar erro de payload

          branch = os.getenv("GITHUB_REF", "")
          is_main = "main" in branch

          if is_main:
              # Gera release note final
              cur.execute(f"""
              SELECT SNOWFLAKE.CORTEX.COMPLETE(
                'llama3.1-70b',
                'Analise as mudanças de código e gere uma nota de versão em linguagem natural:\n{diff_text}'
              ) AS RELEASE_NOTE;
              """)
              result = cur.fetchone()[0]
              print("::set-output name=release_note::" + json.dumps(result))
          else:
              # Gera doc técnica (não armazena)
              cur.execute(f"""
              SELECT SNOWFLAKE.CORTEX.COMPLETE(
                'llama3.1-70b',
                'Analise tecnicamente as mudanças e explique o impacto e novas funcionalidades:\n{diff_text}'
              ) AS TECH_DOC;
              """)
              result = cur.fetchone()[0]
              print("::set-output name=tech_doc::" + json.dumps(result))

          cur.close()
          conn.close()
          EOF

      - name: Comentar resultado no PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ${{ github.base_ref == 'main' && format('🚀 **Release Note Gerada:**\n\n{0}', steps.snowflake.outputs.release_note) || format('🧠 **Análise Técnica:**\n\n{0}', steps.snowflake.outputs.tech_doc) }}

      - name: Enviar notificação ao Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            MESSAGE="🚀 Nova release gerada e armazenada no Snowflake!"
          else
            MESSAGE="🧠 Análise técnica concluída para PR em staging!"
          fi

          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"${MESSAGE}\"}" $SLACK_WEBHOOK_URL

      - name: (Somente main) Inserir release note no Snowflake
        if: github.base_ref == 'main'
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          RELEASE_NOTE: ${{ steps.snowflake.outputs.release_note }}
          GITHUB_PR_NUMBER: ${{ github.event.number }}
          GITHUB_PR_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_AUTHOR: ${{ github.actor }}
        run: |
          python <<'EOF'
          import os, snowflake.connector

          conn = snowflake.connector.connect(
              user=os.getenv("SNOWFLAKE_USER"),
              password=os.getenv("SNOWFLAKE_PASSWORD"),
              account=os.getenv("SNOWFLAKE_ACCOUNT"),
              warehouse=os.getenv("SNOWFLAKE_WAREHOUSE"),
              database=os.getenv("SNOWFLAKE_DATABASE"),
              schema=os.getenv("SNOWFLAKE_SCHEMA"),
              role=os.getenv("SNOWFLAKE_ROLE")
          )
          cur = conn.cursor()
          cur.execute(f"""
            INSERT INTO release_notes (VERSION, PR_NUMBER, AUTHOR, TITLE, CHANGES_SUMMARY, RELEASE_NOTE, CREATED_AT)
            VALUES (
              'v1.0.0',
              {os.getenv("GITHUB_PR_NUMBER")},
              '{os.getenv("GITHUB_AUTHOR")}',
              '{os.getenv("GITHUB_PR_TITLE").replace("'", "''")}',
              'Mudanças integradas automaticamente.',
              '{os.getenv("RELEASE_NOTE").replace("'", "''")}',
              CURRENT_TIMESTAMP()
            );
          """)
          conn.commit()
          cur.close()
          conn.close()
          EOF
