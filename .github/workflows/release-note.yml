name: Save PR Diff to Snowflake (direct)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  save-diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR diff and export as variable
        id: diff
        run: |
          python pr_diff.py
          eval "$(python pr_diff.py)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install snowflake-connector-python

      - name: Save diff to Snowflake
        env:
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          DIFF_B64: ${{ env.DIFF_B64 }}
        run: |
          python <<'EOF'
          import os, base64, snowflake.connector

          pr_number = int(os.getenv("PR_NUMBER", "0"))
          diff_b64 = os.getenv("DIFF_B64", "")

          if not diff_b64:
              raise Exception("❌ Nenhum diff encontrado")

          diff_text = base64.b64decode(diff_b64.encode()).decode(errors="ignore")

          print(f"diff_text length: {len(diff_text)}")

          # Conecta ao Snowflake
          conn = snowflake.connector.connect(
              user=os.getenv("SNOWFLAKE_USER"),
              password=os.getenv("SNOWFLAKE_PASSWORD"),
              account=os.getenv("SNOWFLAKE_ACCOUNT"),
              warehouse=os.getenv("SNOWFLAKE_WAREHOUSE"),
              database=os.getenv("SNOWFLAKE_DATABASE"),
              schema=os.getenv("SNOWFLAKE_SCHEMA"),
              role=os.getenv("SNOWFLAKE_ROLE")
          )

          cur = conn.cursor()
          try:
              
              cur.execute(
                  "INSERT INTO code_diffs (pr_number, diff_text) VALUES (%s, %s)",
                  (pr_number, diff_text)
              )

              print(f"✅ Diff salvo no Snowflake para PR #{pr_number}")
          finally:
              cur.close()
              conn.close()
          EOF
